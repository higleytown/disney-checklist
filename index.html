<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Limelight&family=Cinzel:wght@500;600&family=EB+Garamond:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#f3e7cf;--paper-deep:#e9d7b6;--ink:#2a2018;
    --teal:#1c6160;--teal-deep:#134443;--burgundy:#8a2b2b;
    --gold:#b5853a;--gold-light:#d9b56b;--line:#cdb487;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
  html{ -webkit-text-size-adjust:100%; }
  body{
    font-family:'EB Garamond',Georgia,serif;color:var(--ink);
    background-color:#dccaa3;
    background:
      radial-gradient(circle at 20% 10%, rgba(255,255,255,.35), transparent 45%),
      radial-gradient(circle at 85% 90%, rgba(120,80,30,.10), transparent 50%),
      repeating-linear-gradient(135deg, rgba(140,100,40,.025) 0 2px, transparent 2px 7px),
      var(--paper);
    min-height:100vh;padding:18px 14px 60px;line-height:1.4;
  }
  .wrap{max-width:680px;margin:0 auto;}

  header{
    text-align:center;border:3px double var(--teal-deep);
    background:repeating-linear-gradient(45deg, rgba(28,97,96,.04) 0 6px, transparent 6px 12px),var(--paper-deep);
    border-radius:6px;padding:20px 16px 16px;position:relative;
    box-shadow:0 6px 18px rgba(60,40,15,.22);
  }
  header::before, header::after{content:"★";color:var(--gold);font-size:13px;position:absolute;top:8px;}
  header::before{left:12px;} header::after{right:12px;}
  .kicker{font-family:'Cinzel',serif;letter-spacing:.28em;font-size:11px;
    text-transform:uppercase;color:var(--burgundy);margin-bottom:6px;}
  h1{font-family:'Limelight',serif;font-size:clamp(28px,8vw,42px);color:var(--teal-deep);
    letter-spacing:.02em;line-height:1.05;text-shadow:1px 1px 0 var(--gold-light);}
  .sub{font-style:italic;font-size:14px;color:#5b4a33;margin-top:6px;}

  .plan-bar{margin:14px 0 0;background:var(--paper-deep);border:1.5px solid var(--line);
    border-radius:6px;padding:11px 13px;box-shadow:0 3px 10px rgba(60,40,15,.12);}
  .plan-label{display:block;font-family:'Cinzel',serif;font-size:11px;letter-spacing:.08em;
    text-transform:uppercase;color:var(--teal-deep);margin-bottom:6px;}
  select#slotSelect{display:block;width:100%;font-family:'EB Garamond',serif;font-size:16px;
    color:var(--ink);background:var(--paper);border:1.5px solid var(--teal);border-radius:5px;padding:9px 10px;}
  .plan-actions{display:flex;gap:8px;margin-top:10px;}
  .plan-actions .icon-btn{flex:1;text-align:center;}
  .icon-btn{font-family:'Cinzel',serif;font-size:12px;letter-spacing:.04em;cursor:pointer;
    border:1.5px solid var(--teal-deep);background:transparent;color:var(--teal-deep);
    border-radius:5px;padding:7px 11px;transition:.16s;white-space:nowrap;}
  .icon-btn:active{background:var(--teal-deep);color:var(--paper);}
  .icon-btn.danger{border-color:var(--burgundy);color:var(--burgundy);}
  .icon-btn.danger:active{background:var(--burgundy);color:var(--paper);}
  .saved-at{font-size:12px;font-style:italic;color:#8a795c;margin-top:8px;}
  .saved-at.warn{color:var(--burgundy);font-style:normal;font-weight:600;}

  .progress-card{margin:12px 0;background:var(--paper-deep);border:1.5px solid var(--line);
    border-radius:6px;padding:12px 14px;box-shadow:0 3px 10px rgba(60,40,15,.12);}
  .progress-top{display:flex;justify-content:space-between;align-items:baseline;
    font-family:'Cinzel',serif;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--teal-deep);}
  .progress-top b{font-size:18px;color:var(--burgundy);font-family:'EB Garamond',serif;}
  .bar{height:11px;margin-top:9px;border-radius:20px;background:#d8c39a;border:1px solid var(--line);overflow:hidden;}
  .bar span{display:block;height:100%;width:0;border-radius:20px;
    background:linear-gradient(90deg,var(--teal),var(--gold));transition:width .45s cubic-bezier(.3,.9,.4,1);}

  .filters{display:flex;gap:7px;margin:14px 0 4px;}
  .filters button{flex:1;cursor:pointer;font-family:'Cinzel',serif;font-size:11px;letter-spacing:.05em;
    text-transform:uppercase;padding:9px 4px;border:1.5px solid var(--teal-deep);background:transparent;
    color:var(--teal-deep);border-radius:5px;transition:.18s;}
  .filters button.active{background:var(--teal-deep);color:var(--paper);}
  .filters .edit-toggle{flex:none;width:46px;font-size:16px;padding:9px 0;
    border-color:var(--burgundy);color:var(--burgundy);}
  .filters .edit-toggle.active{background:var(--burgundy);color:var(--paper);border-color:var(--burgundy);}
  .edit-hint{display:none;font-size:12px;font-style:italic;color:var(--burgundy);margin:7px 2px 0;}
  .edit-hint.show{display:block;}

  .land{margin-top:20px;}
  .land-head{display:flex;align-items:center;gap:10px;background:var(--teal-deep);color:var(--paper);
    border-radius:6px 6px 0 0;padding:9px 14px;border:2px solid var(--teal-deep);border-bottom:none;}
  .land-head .name{font-family:'Cinzel',serif;font-weight:600;font-size:14px;letter-spacing:.06em;
    text-transform:uppercase;flex:1;}
  .land-head .tally{font-size:12px;font-family:'EB Garamond',serif;background:var(--gold);
    color:var(--teal-deep);padding:2px 9px;border-radius:20px;font-weight:600;}
  .land-body{border:2px solid var(--teal-deep);border-top:none;border-radius:0 0 6px 6px;
    background:var(--paper-deep);overflow:hidden;}
  .row{display:flex;align-items:center;gap:12px;padding:12px 13px;cursor:pointer;
    border-bottom:1px dashed var(--line);transition:background .15s;position:relative;}
  .row:last-child{border-bottom:none;}
  .row:active{background:rgba(28,97,96,.08);}
  .tick{flex:none;width:26px;height:26px;border-radius:50%;border:2px solid var(--teal);
    display:flex;align-items:center;justify-content:center;color:transparent;font-size:15px;
    font-weight:700;transition:.18s;background:var(--paper);}
  .label{flex:1;font-size:17px;transition:.18s;}
  .star{flex:none;font-size:20px;color:var(--line);padding:2px 4px;transition:transform .15s,color .15s;line-height:1;}
  .star:active{transform:scale(1.3);}
  .row.done .tick{background:var(--teal);border-color:var(--teal);color:var(--paper);}
  .row.done .label{text-decoration:line-through;color:#9c8c70;}
  .row.starred .star{color:var(--gold);text-shadow:0 0 1px var(--gold);}
  .row.starred{background:rgba(181,133,58,.10);}
  .row.starred.done{background:rgba(28,97,96,.06);}
  .empty{text-align:center;font-style:italic;color:#8a795c;padding:30px 10px;}
  .kill{display:none;flex:none;font-size:15px;color:#c2ac80;padding:3px 5px;line-height:1;transition:transform .15s,color .15s;}
  .editing .kill{display:block;}
  .kill:active{color:var(--burgundy);transform:scale(1.25);}
  .row.add-row{cursor:pointer;}
  .tick.plus{border-style:dashed;color:var(--teal);background:transparent;font-weight:700;}
  .add-label{color:var(--teal-deep);font-style:italic;}
  .extras-head{background:var(--burgundy);border-color:var(--burgundy);}
  .extras-head .tally{background:var(--gold-light);color:var(--burgundy);}
  .removed-head{background:#9c8c70;border-color:#9c8c70;}
  .land-head.collapsible{cursor:pointer;}
  .land-head .chev{flex:none;font-size:13px;line-height:1;margin-left:2px;}
  .removed-row{justify-content:space-between;cursor:default;}
  .removed-row:active{background:transparent;}
  .removed-row .label{color:#8a795c;}
  .icon-btn.restore{padding:5px 12px;font-size:11px;flex:none;}

  footer{margin-top:26px;text-align:center;}
  .legend{display:flex;justify-content:center;gap:16px;flex-wrap:wrap;font-size:12px;color:#6b5a3f;margin-top:10px;}
  .legend span{display:inline-flex;align-items:center;gap:5px;}
  .note{font-size:12px;color:#8a795c;margin-top:14px;font-style:italic;}
  .save-flash{position:fixed;left:50%;bottom:18px;transform:translateX(-50%) translateY(20px);
    background:var(--teal-deep);color:var(--paper);font-family:'Cinzel',serif;font-size:11px;
    letter-spacing:.08em;padding:8px 16px;border-radius:20px;opacity:0;pointer-events:none;transition:.3s;
    text-transform:uppercase;box-shadow:0 4px 12px rgba(0,0,0,.25);}
  .save-flash.show{opacity:1;transform:translateX(-50%) translateY(0);}

  .modal{position:fixed;inset:0;background:rgba(40,30,15,.55);display:none;
    align-items:center;justify-content:center;padding:22px;z-index:50;}
  .modal.show{display:flex;}
  .modal-box{background:var(--paper);border:3px double var(--teal-deep);border-radius:8px;
    max-width:380px;width:100%;padding:20px 18px;box-shadow:0 12px 36px rgba(0,0,0,.35);}
  .modal-title{font-family:'Cinzel',serif;font-size:16px;color:var(--teal-deep);line-height:1.35;}
  #mInputWrap{margin-top:14px;}
  #mInput{width:100%;font-family:'EB Garamond',serif;font-size:17px;color:var(--ink);
    background:var(--paper-deep);border:1.5px solid var(--teal);border-radius:5px;padding:10px 11px;}
  .modal-error{color:var(--burgundy);font-size:13px;font-weight:600;min-height:16px;margin-top:8px;}
  .modal-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:6px;}
  .modal-actions .icon-btn{padding:9px 16px;font-size:13px;}
  #mOk{background:var(--teal-deep);color:var(--paper);}
  #mOk.danger{background:var(--burgundy);border-color:var(--burgundy);}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="kicker">Admit One · Good for One Day</div>
    <h1>Disneyland Park</h1>
    <div class="sub">Attraction Ticket Book — your last-day plan</div>
  </header>

  <div class="plan-bar">
    <div class="plan-label">Plan</div>
    <select id="slotSelect" aria-label="Saved plan"></select>
    <div class="plan-actions">
      <button class="icon-btn" id="newBtn">＋ New</button>
      <button class="icon-btn" id="renameBtn">Rename</button>
      <button class="icon-btn danger" id="deleteBtn">Delete</button>
    </div>
    <div class="saved-at" id="savedAt">Changes save automatically</div>
  </div>

  <div class="progress-card">
    <div class="progress-top">
      <span id="progLabel">Adventures Completed</span>
      <span><b id="doneCount">0</b><span id="progSlash"> / </span><span id="totalCount">0</span></span>
    </div>
    <div class="bar"><span id="barFill"></span></div>
  </div>

  <div class="filters">
    <button data-filter="all" class="active">All</button>
    <button data-filter="star">★ Must-Do</button>
    <button data-filter="todo">Unfinished</button>
    <button id="editToggle" class="edit-toggle" aria-label="Edit list (remove items)" title="Edit list">✎</button>
  </div>
  <div class="edit-hint" id="editHint">Tap ✕ to remove an item. Bring rides back from “Removed” at the bottom.</div>

  <div id="list"></div>

  <footer>
    <div class="legend">
      <span>⊙ tap row to check off</span>
      <span>★ tap star for a must-do</span>
    </div>
    <p class="note" id="footNote"></p>
    <p class="note" style="margin-top:10px;margin-bottom:14px;">
      <button class="icon-btn danger" id="clearBtn">Clear this plan</button>
    </p>
  </footer>
</div>
<div class="modal" id="modal">
  <div class="modal-box">
    <div class="modal-title" id="mTitle"></div>
    <div id="mInputWrap"><input id="mInput" type="text" autocomplete="off"></div>
    <div class="modal-error" id="mError"></div>
    <div class="modal-actions">
      <button class="icon-btn" id="mCancel">Cancel</button>
      <button class="icon-btn" id="mOk">OK</button>
    </div>
  </div>
</div>
<div class="save-flash" id="flash">Saved ✓</div>

<script>
const DATA = [
  ["Main Street, U.S.A.", [
    ["ms1","Disneyland Railroad (Main Street Station)"],["ms2","Walt Disney – A Magical Life"],
    ["ms3","The Disneyland Story exhibit"],["ms4","Main Street Cinema"],["ms5","Main Street Vehicles"],
  ]],
  ["Adventureland", [
    ["ad1","Indiana Jones Adventure"],["ad2","Jungle Cruise"],
    ["ad3","Walt Disney's Enchanted Tiki Room"],["ad4","Adventureland Treehouse"],
  ]],
  ["New Orleans Square", [
    ["no1","Pirates of the Caribbean"],["no2","Haunted Mansion"],
    ["no3","Disneyland Railroad (New Orleans Square Station)"],
  ]],
  ["Bayou Country", [
    ["by1","Tiana's Bayou Adventure"],["by2","The Many Adventures of Winnie the Pooh"],
    ["by3","Davy Crockett's Explorer Canoes"],
  ]],
  ["Frontierland", [
    ["fr1","Big Thunder Mountain Railroad"],["fr2","Mark Twain Riverboat"],["fr3","Sailing Ship Columbia"],
    ["fr4","Pirate's Lair on Tom Sawyer Island"],["fr5","Frontierland Shootin' Exposition"],
    ["fr6","Fantasmic! (nighttime show)"],
  ]],
  ["Star Wars: Galaxy's Edge", [
    ["sw1","Star Wars: Rise of the Resistance"],["sw2","Millennium Falcon: Smugglers Run"],
  ]],
  ["Fantasyland", [
    ["fa1","Peter Pan's Flight"],["fa2","Matterhorn Bobsleds"],["fa3","It's a Small World"],
    ["fa4","Alice in Wonderland"],["fa5","Mr. Toad's Wild Ride"],["fa6","Snow White's Enchanted Wish"],
    ["fa7","Pinocchio's Daring Journey"],["fa8","King Arthur Carrousel"],["fa9","Mad Tea Party"],
    ["fa10","Dumbo the Flying Elephant"],["fa11","Casey Jr. Circus Train"],["fa12","Storybook Land Canal Boats"],
    ["fa13","Pixie Hollow"],["fa14","Sleeping Beauty Castle Walkthrough"],
    ["fa15","Bluey's Best Day Ever! (Fantasyland Theatre)"],
  ]],
  ["Mickey's Toontown", [
    ["mt1","Mickey & Minnie's Runaway Railway"],["mt2","Roger Rabbit's Car Toon Spin"],
    ["mt3","Chip 'n' Dale's GADGETcoaster"],["mt4","Mickey's House / Minnie's House"],
    ["mt5","Donald's Duck Pond & Goofy's How-to-Play Yard"],
  ]],
  ["Tomorrowland", [
    ["to1","Space Mountain"],["to2","Star Tours – The Adventures Continue"],
    ["to3","Buzz Lightyear Astro Blasters"],["to4","Finding Nemo Submarine Voyage"],
    ["to5","Autopia"],["to6","Astro Orbitor"],["to7","Disneyland Monorail"],
  ]],
];

const KEY="dl-checklist-v3";
const OLD_KEYS=["dl-checklist-v2","dl-checklist-v1"];
const hasArtifactStore = typeof window!=="undefined" && window.storage && typeof window.storage.get==="function";

// Detect a working browser store (works when the file is opened directly in a browser)
let canLocal=false;
try{ const t="__dl_test__"; localStorage.setItem(t,"1"); localStorage.removeItem(t); canLocal=true; }catch(e){ canLocal=false; }

const backendAvailable = hasArtifactStore || canLocal;
let lastSaveOk = backendAvailable ? null : false;

let store = { current:"My Day", slots:{ "My Day":{done:{},star:{},removed:{},custom:[],updated:0} } };
let filter = "all";
let removedCollapsed = true;
function cur(){ return store.slots[store.current]; }

async function readKey(k){
  if(hasArtifactStore){ try{ const r=await window.storage.get(k,false); if(r&&r.value) return r.value; }catch(e){} }
  try{ const v=localStorage.getItem(k); if(v) return v; }catch(e){}
  return null;
}
async function load(){
  let raw=await readKey(KEY);
  if(raw){
    try{
      const p=JSON.parse(raw);
      if(p&&p.slots&&Object.keys(p.slots).length){
        store=p;
        if(!store.slots[store.current]) store.current=Object.keys(store.slots)[0];
        return;
      }
    }catch(e){}
  }
  // migrate from an older version if found
  for(const ok of OLD_KEYS){
    const old=await readKey(ok);
    if(old){
      try{
        const p=JSON.parse(old);
        if(p.slots){ store=p; if(!store.slots[store.current]) store.current=Object.keys(store.slots)[0]; }
        else { store.slots["My Day"]={done:p.done||{},star:p.star||{},updated:Date.now()}; }
        return;
      }catch(e){}
    }
  }
}

let flashTimer=null;
function flash(){
  const f=document.getElementById("flash");
  f.classList.add("show");
  clearTimeout(flashTimer);
  flashTimer=setTimeout(()=>f.classList.remove("show"),900);
}
async function persist(opts={flash:true}){
  cur().updated=Date.now();
  const json=JSON.stringify(store);
  let ok=false;
  if(hasArtifactStore){ try{ await window.storage.set(KEY,json,false); ok=true; }catch(e){} }
  try{ localStorage.setItem(KEY,json); ok=true; }catch(e){}
  lastSaveOk=ok;
  updateSavedAt();
  if(ok && opts.flash) flash();
}

function fmtTime(ts){
  if(!ts) return "Changes save automatically";
  const d=new Date(ts), today=new Date();
  const t=d.toLocaleTimeString([], {hour:'numeric', minute:'2-digit'});
  return d.toDateString()===today.toDateString()
    ? "Last saved today at "+t
    : "Last saved "+d.toLocaleDateString([], {month:'short',day:'numeric'})+" at "+t;
}
function updateSavedAt(){
  const el=document.getElementById("savedAt");
  if(lastSaveOk===false){
    el.textContent="⚠ Not saving here — see the tip up top to keep your progress.";
    el.classList.add("warn");
  }else{
    el.classList.remove("warn");
    el.textContent=fmtTime(cur().updated);
  }
}

function setupTip(){
  const note=document.getElementById("footNote");
  note.textContent = backendAvailable
    ? "Tip: in your browser, use Share → Add to Home Screen to keep this like an app."
    : "Open this in your phone's browser so every tap saves automatically.";
}

const RIDE_IDS = DATA.flatMap(([,items])=>items.map(i=>i[0]));
const RIDE_NAMES = {};
DATA.forEach(([,items])=>items.forEach(([id,name])=>{ RIDE_NAMES[id]=name; }));

function ensurePlanShape(c){ if(!c.removed) c.removed={}; if(!c.custom) c.custom=[]; }
function effectiveItems(){
  const c=cur();
  const ride=RIDE_IDS.filter(id=>!c.removed[id]);
  const cust=(c.custom||[]).map(it=>it.id);
  return ride.concat(cust);
}

// Section header tally, matching the main counter's filter logic.
// Returns null when there's nothing to show for the current filter.
function tallyText(ids){
  const c=cur();
  if(filter==="star"){
    const st=ids.filter(id=>c.star[id]);
    return st.length ? (st.filter(id=>c.done[id]).length+"/"+st.length) : null;
  }
  if(filter==="todo"){
    const rem=ids.filter(id=>!c.done[id]).length;
    return rem ? String(rem) : null;
  }
  const dn=ids.filter(id=>c.done[id]).length;
  return ids.length ? (dn+"/"+ids.length) : null;
}

function makeRow(id,name,type){
  const c=cur();
  const row=document.createElement("div");
  row.className="row"+(c.done[id]?" done":"")+(c.star[id]?" starred":"");
  row.innerHTML='<div class="tick">✓</div><div class="label"></div><div class="star">★</div><div class="kill" title="Remove">✕</div>';
  row.querySelector(".label").textContent=name;
  row.addEventListener("click",(e)=>{
    if(e.target.classList.contains("star")||e.target.classList.contains("kill")) return;
    const cc=cur(); cc.done[id]=!cc.done[id]; if(!cc.done[id]) delete cc.done[id];
    persist(); render();
  });
  row.querySelector(".star").addEventListener("click",(e)=>{
    e.stopPropagation();
    const cc=cur(); cc.star[id]=!cc.star[id]; if(!cc.star[id]) delete cc.star[id];
    persist(); render();
  });
  row.querySelector(".kill").addEventListener("click",(e)=>{
    e.stopPropagation(); confirmRemove(id,name,type);
  });
  return row;
}

function confirmRemove(id,name,type){
  if(type==="custom"){
    showModal({title:`Delete \u201C${name}\u201D from your list?`, okLabel:"Delete", danger:true, onConfirm:()=>{
      const c=cur();
      c.custom=(c.custom||[]).filter(it=>it.id!==id);
      delete c.done[id]; delete c.star[id];
      persist(); render();
    }});
  }else{
    showModal({title:`Remove \u201C${name}\u201D from this plan? You can bring it back from \u201CRemoved\u201D at the bottom.`, okLabel:"Remove", danger:true, onConfirm:()=>{
      const c=cur(); c.removed[id]=true; persist(); render();
    }});
  }
}

function openAddItem(){
  showModal({title:"Add a restaurant, snack, or show", withInput:true,
    placeholder:"e.g. Lunch at Carnation Cafe, Dole Whip, Fantasmic",
    okLabel:"Add", onConfirm:(name)=>{
      if(!name){ modalError("Type something to add."); return false; }
      const c=cur(); c.custom=c.custom||[];
      const id="c"+Date.now()+Math.floor(Math.random()*1000);
      c.custom.push({id, name});
      c.star[id]=true;   // custom items are Must-Do by default
      persist(); render();
    }});
}

function buildSection(title, tallyText, opts={}){
  const sec=document.createElement("div");
  sec.className="land";
  const head=document.createElement("div");
  head.className="land-head"+(opts.headCls?(" "+opts.headCls):"");
  const nm=document.createElement("span"); nm.className="name"; nm.textContent=title; head.appendChild(nm);
  if(tallyText!=null){ const tl=document.createElement("span"); tl.className="tally"; tl.textContent=tallyText; head.appendChild(tl); }
  sec.appendChild(head);
  const body=document.createElement("div"); body.className="land-body"; sec.appendChild(body);
  return {sec, body, head};
}

function render(){
  const c=cur();
  ensurePlanShape(c);
  const list=document.getElementById("list");
  list.innerHTML="";

  DATA.forEach(([land,items])=>{
    const present=items.filter(([id])=>!c.removed[id]);
    if(present.length===0) return;
    const shown=present.filter(([id])=>{
      if(filter==="star") return c.star[id];
      if(filter==="todo") return !c.done[id];
      return true;
    });
    if(shown.length===0) return;
    const {sec,body}=buildSection(land, tallyText(present.map(([id])=>id)));
    shown.forEach(([id,name])=> body.appendChild(makeRow(id,name,"ride")));
    list.appendChild(sec);
  });

  // Extras (your custom items) — always shown so you can add anytime
  const customAll=c.custom||[];
  const customShown=customAll.filter(it=>{
    if(filter==="star") return c.star[it.id];
    if(filter==="todo") return !c.done[it.id];
    return true;
  });
  const ex=buildSection("Extras · Food & Shows", tallyText(customAll.map(it=>it.id)), {headCls:"extras-head"});
  customShown.forEach(it=> ex.body.appendChild(makeRow(it.id, it.name, "custom")));
  const add=document.createElement("div");
  add.className="row add-row";
  add.innerHTML='<div class="tick plus">＋</div><div class="label add-label"></div>';
  add.querySelector(".add-label").textContent="Add a restaurant, snack, or show…";
  add.addEventListener("click", openAddItem);
  ex.body.appendChild(add);
  list.appendChild(ex.sec);

  // Removed rides — restore from here (collapsible)
  const removedIds=Object.keys(c.removed).filter(id=>c.removed[id]);
  if(removedIds.length){
    const rm=buildSection("Removed", String(removedIds.length), {headCls:"removed-head"});
    rm.head.classList.add("collapsible");
    const chev=document.createElement("span"); chev.className="chev";
    chev.textContent = removedCollapsed ? "▸" : "▾";
    rm.head.appendChild(chev);
    rm.head.addEventListener("click", ()=>{ removedCollapsed=!removedCollapsed; render(); });
    if(removedCollapsed){ rm.body.style.display="none"; }
    removedIds.forEach(id=>{
      const row=document.createElement("div"); row.className="row removed-row";
      const lab=document.createElement("div"); lab.className="label"; lab.textContent=RIDE_NAMES[id]||id;
      const btn=document.createElement("button"); btn.className="icon-btn restore"; btn.textContent="Restore";
      btn.addEventListener("click",()=>{ const cc=cur(); delete cc.removed[id]; persist(); render(); });
      row.appendChild(lab); row.appendChild(btn);
      rm.body.appendChild(row);
    });
    list.appendChild(rm.sec);
  }

  const eff=effectiveItems(), total=eff.length, doneAll=eff.filter(id=>c.done[id]).length;
  let label="Adventures Completed", num=doneAll, denom=total, showDenom=true, barPct=total?doneAll/total*100:0;
  if(filter==="star"){
    const st=eff.filter(id=>c.star[id]);
    label="Must-Dos Completed"; num=st.filter(id=>c.done[id]).length; denom=st.length;
    barPct=denom?num/denom*100:0;
  }else if(filter==="todo"){
    label="Unfinished Adventures"; num=total-doneAll; showDenom=false;
    barPct=total?doneAll/total*100:0;
  }
  document.getElementById("progLabel").textContent=label;
  document.getElementById("doneCount").textContent=num;
  document.getElementById("totalCount").textContent=denom;
  document.getElementById("progSlash").style.display=showDenom?"":"none";
  document.getElementById("totalCount").style.display=showDenom?"":"none";
  document.getElementById("barFill").style.width=barPct+"%";
}

function refreshSlotSelect(){
  const sel=document.getElementById("slotSelect");
  sel.innerHTML="";
  Object.keys(store.slots).forEach(name=>{
    const o=document.createElement("option");
    o.value=name; o.textContent=name;
    if(name===store.current) o.selected=true;
    sel.appendChild(o);
  });
}

document.getElementById("slotSelect").addEventListener("change",(e)=>{
  store.current=e.target.value; persist({flash:false}); render();
});
/* Custom in-page dialog (native prompt/confirm are blocked in the in-app preview) */
const modal=document.getElementById("modal");
const mTitle=document.getElementById("mTitle");
const mInputWrap=document.getElementById("mInputWrap");
const mInput=document.getElementById("mInput");
const mError=document.getElementById("mError");
const mOk=document.getElementById("mOk");
const mCancel=document.getElementById("mCancel");
let modalConfirm=null;
function showModal({title, withInput=false, value="", placeholder="", okLabel="OK", danger=false, onConfirm}){
  mTitle.textContent=title;
  mInputWrap.style.display=withInput?"block":"none";
  mInput.value=value; mInput.placeholder=placeholder||"";
  mError.textContent="";
  mOk.textContent=okLabel;
  mOk.classList.toggle("danger", !!danger);
  modalConfirm=onConfirm||null;
  modal.classList.add("show");
  if(withInput) setTimeout(()=>{ mInput.focus(); mInput.select(); }, 50);
}
function closeModal(){ modal.classList.remove("show"); modalConfirm=null; }
function modalError(msg){ mError.textContent=msg; }
mCancel.addEventListener("click", closeModal);
modal.addEventListener("click",(e)=>{ if(e.target===modal) closeModal(); });
mOk.addEventListener("click",()=>{
  if(modalConfirm){ if(modalConfirm(mInput.value.trim())!==false) closeModal(); }
  else closeModal();
});
mInput.addEventListener("keydown",(e)=>{ if(e.key==="Enter"){ e.preventDefault(); mOk.click(); } });

document.getElementById("newBtn").addEventListener("click",()=>{
  showModal({title:"Name this plan", withInput:true, placeholder:"e.g. Saturday, or a family member",
    okLabel:"Create", onConfirm:(name)=>{
      if(!name){ modalError("Please enter a name."); return false; }
      if(!store.slots[name]) store.slots[name]={done:{},star:{},removed:{},custom:[],updated:Date.now()};
      store.current=name; refreshSlotSelect(); persist(); render();
    }});
});
document.getElementById("renameBtn").addEventListener("click",()=>{
  const old=store.current;
  showModal({title:"Rename this plan", withInput:true, value:old, okLabel:"Save",
    onConfirm:(name)=>{
      if(!name){ modalError("Please enter a name."); return false; }
      if(name===old) return;
      if(store.slots[name]){ modalError("That name already exists."); return false; }
      store.slots[name]=store.slots[old]; delete store.slots[old]; store.current=name;
      refreshSlotSelect(); persist(); render();
    }});
});
document.getElementById("deleteBtn").addEventListener("click",()=>{
  if(Object.keys(store.slots).length<=1){
    showModal({title:"This is your only plan. Use \u201CClear this plan\u201D to empty it instead.", okLabel:"Got it"});
    return;
  }
  showModal({title:`Delete the plan \u201C${store.current}\u201D? This can't be undone.`, okLabel:"Delete", danger:true,
    onConfirm:()=>{
      delete store.slots[store.current]; store.current=Object.keys(store.slots)[0];
      refreshSlotSelect(); persist(); render();
    }});
});
document.getElementById("clearBtn").addEventListener("click",()=>{
  showModal({title:`Clear all check-offs and stars in \u201C${store.current}\u201D?`, okLabel:"Clear", danger:true,
    onConfirm:()=>{
      const c=cur(); c.done={}; c.star={}; c.updated=Date.now();
      persist(); render();
    }});
});
document.querySelectorAll(".filters button[data-filter]").forEach(b=>{
  b.addEventListener("click",()=>{
    document.querySelectorAll(".filters button[data-filter]").forEach(x=>x.classList.remove("active"));
    b.classList.add("active"); filter=b.dataset.filter; render();
  });
});

let editMode=false;
document.getElementById("editToggle").addEventListener("click",()=>{
  editMode=!editMode;
  document.getElementById("editToggle").classList.toggle("active", editMode);
  document.getElementById("list").classList.toggle("editing", editMode);
  document.getElementById("editHint").classList.toggle("show", editMode);
});

(async()=>{
  setupTip();
  await load();
  refreshSlotSelect();
  updateSavedAt();
  render();
})();
</script>
</body>
</html>
